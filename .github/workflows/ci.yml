name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore DevFreela.sln

      - name: Build
        run: dotnet build DevFreela.sln --no-restore --configuration Release

      - name: Test
        run: dotnet test DevFreela.sln --no-build --configuration Release --verbosity normal
